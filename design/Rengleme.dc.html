<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>Oyun — Rəngləmə guşəsi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF4E2}
a{color:#1B2A4A}a:hover{color:#E8682A}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.rg path{transition:fill .25s ease}
.rg path:hover{filter:brightness(.96)}
button:focus-visible,a:focus-visible{outline:3px solid #E8682A;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 1500px; box-sizing: border-box; background: #FFF4E2; color: #1B2A4A; font-family: Nunito, system-ui, sans-serif; overflow: hidden; position: relative; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px">
    <a href="OyunParki.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 0 #EAD9BE; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px; text-decoration: none">← Oyun parkı</a>
    <span style="font-weight: 800; font-size: 14px; background: #FFE08A; padding: 8px 12px; border-radius: 99px">{{done}} / {{total}} hissə</span>
  </div>

  <div style="padding: 4px 20px 0">
    <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 30px; line-height: 1">Rəngləmə guşəsi</h1>
    <div style="font-size: 15px; font-weight: 700; color: #3C4B6B; margin-top: 6px">Şəkil seç, rəng seç, hissəyə toxun.</div>
  </div>

  <!-- PICTURE PICKER -->
  <div style="display: flex; gap: 10px; padding: 14px 16px 4px; overflow-x: auto">
    <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="6">
      <button onClick="{{t.pick}}" aria-label="{{t.name}}" style="{{t.style}}">
        <svg viewBox="0 0 320 320" style="width: 76px; height: 76px; display: block; border-radius: 14px">
          <sc-for list="{{t.regions}}" as="q" hint-placeholder-count="10"><path d="{{q.d}}" fill="{{q.sample}}" fill-rule="evenodd" stroke="#1B2A4A" stroke-width="6" stroke-linejoin="round"></path></sc-for>
        </svg>
        <span style="display: block; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 12px; margin-top: 6px; white-space: nowrap">{{t.name}}</span>
        <span style="{{t.lvl}}">{{t.level}}</span>
      </button>
    </sc-for>
  </div>

  <!-- CANVAS -->
  <div style="margin: 12px 16px 0; background: #FFFFFF; border-radius: 28px; padding: 12px; box-shadow: 0 8px 0 #EAD9BE; position: relative">
    <svg class="rg" viewBox="0 0 320 320" style="width: 334px; height: 334px; display: block; border-radius: 18px; touch-action: manipulation">
      <sc-for list="{{regions}}" as="g" hint-placeholder-count="20">
        <path d="{{g.d}}" fill="{{g.fill}}" fill-rule="evenodd" stroke="#1B2A4A" stroke-width="3" stroke-linejoin="round" onClick="{{g.paint}}" style="cursor: pointer"></path>
      </sc-for>
    </svg>
    <sc-if value="{{finished}}" hint-placeholder-val="{{ false }}">
      <div class="pop" style="position: absolute; left: 24px; right: 24px; bottom: 24px; background: #7BC67E; border-radius: 20px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; box-shadow: inset -4px -5px 0 rgba(0,0,0,.12), 0 5px 0 #57A05A">
        <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 18px">Usta rəssam!</span>
        <button onClick="{{download}}" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: #FFFFFF; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 14px; color: #1B2A4A; cursor: pointer">Şəkli yüklə</button>
      </div>
    </sc-if>
  </div>

  <!-- PALETTE -->
  <div style="padding: 18px 16px 0">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{palette}}" as="p" hint-placeholder-count="14">
        <button onClick="{{p.pick}}" aria-label="{{p.name}}" style="{{p.style}}">{{p.mark}}</button>
      </sc-for>
    </div>
  </div>

  <!-- TOOLS -->
  <div style="padding: 16px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button onClick="{{undo}}" style="min-height: 52px; border: 0; border-radius: 16px; background: #FFFFFF; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px; color: #1B2A4A; cursor: pointer; box-shadow: 0 4px 0 #EAD9BE; opacity: {{undoOp}}">↶ Geri al</button>
    <button onClick="{{sample}}" style="min-height: 52px; border: 0; border-radius: 16px; background: #FFE08A; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px; color: #1B2A4A; cursor: pointer; box-shadow: 0 4px 0 #D9B24F">Nümunə</button>
    <button onClick="{{clear}}" style="min-height: 52px; border: 0; border-radius: 16px; background: #1B2A4A; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px; color: #FFFFFF; cursor: pointer">Təmizlə</button>
  </div>

  <div style="flex: 1"></div>
  <div style="margin: 20px 16px 18px; font-size: 13px; font-weight: 700; color: #3C4B6B; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; box-shadow: 0 4px 0 #EAD9BE">Şəkillər saxlanmır və heç yerə göndərilmir. Bəyəndiyinizi yükləyib çap edin.</div>
</div>
</x-dc>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pic: 0, color: 0, fills: {}, hist: [] }; }
  renderVals() {
    const st = this.state;
    const pic = PICS[st.pic];
    const fills = st.fills;
    const setFill = (id, val) => this.setState({ fills: { ...fills, [id]: val }, hist: [...st.hist, { id, prev: fills[id] }] });
    const regions = pic.regions.map((g) => ({ d: g.d, fill: fills[g.id] || '#FFFFFF', paint: () => setFill(g.id, PAL[st.color][1]) }));
    const done = pic.regions.filter((g) => fills[g.id] && fills[g.id] !== '#FFFFFF').length;
    const lvlC = { 'Asan': '#7BC67E', 'Orta': '#FFC23D', 'Çətin': '#E8682A' };
    const thumbs = PICS.map((p, i) => ({
      name: p.name, level: p.level, regions: p.regions,
      pick: () => this.setState({ pic: i, fills: {}, hist: [] }),
      lvl: 'display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: ' + lvlC[p.level],
      style: 'flex: 0 0 auto; border: 0; cursor: pointer; padding: 8px; border-radius: 20px; background: #FFFFFF; font-family: Nunito, sans-serif; color: #1B2A4A; box-shadow: ' + (i === st.pic ? '0 0 0 3px #1B2A4A, 0 5px 0 #EAD9BE' : '0 5px 0 #EAD9BE')
    }));
    const palette = PAL.map(([name, c], i) => ({
      name, mark: c === '#FFFFFF' ? '⌫' : '',
      pick: () => this.setState({ color: i }),
      style: 'aspect-ratio: 1 / 1; min-height: 44px; border: ' + (c === '#FFFFFF' ? '2px dashed #8C96A8' : '0') + '; border-radius: 50%; cursor: pointer; font-size: 16px; color: #1B2A4A; background: ' + c + '; box-shadow: inset -3px -4px 0 rgba(0,0,0,.14), inset 3px 3px 0 rgba(255,255,255,.35)' + (i === st.color ? ', 0 0 0 3px #FFF4E2, 0 0 0 6px #1B2A4A' : '')
    }));
    const download = () => {
      try {
        const body = pic.regions.map((g) => '<path d="' + g.d + '" fill="' + (fills[g.id] || '#FFFFFF') + '" fill-rule="evenodd" stroke="#1B2A4A" stroke-width="3" stroke-linejoin="round"/>').join('');
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="960" height="960">' + body + '</svg>';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
        a.download = pic.name + '.svg';
        a.click();
      } catch (_) {}
    };
    return {
      thumbs, regions, palette, download,
      done: String(done), total: String(pic.regions.length),
      finished: done === pic.regions.length,
      undoOp: st.hist.length ? '1' : '.5',
      undo: () => { if (!st.hist.length) return; const h = st.hist[st.hist.length - 1]; const f = { ...fills }; if (h.prev === undefined) delete f[h.id]; else f[h.id] = h.prev; this.setState({ fills: f, hist: st.hist.slice(0, -1) }); },
      sample: () => { const f = {}; pic.regions.forEach((g) => { f[g.id] = g.sample; }); this.setState({ fills: f, hist: [] }); },
      clear: () => this.setState({ fills: {}, hist: [] })
    };
  }
}
